const completed=Array.isArray(saved.completedLevels) ? new Set(saved.completedLevels.map(Number).filter(n=>n>=1&&n<=37)).size : 0;
const PROGRESS='Local progress: '+completed+'/37 levels';
document.getElementById('nm').value=(typeof NAME!=='undefined'&&NAME)||'';
function draw(){
 const c=document.getElementById('c'),x=c.getContext('2d');
 x.fillStyle='#0B1020';x.fillRect(0,0,1200,675);
 x.strokeStyle='#D4AF37';x.lineWidth=10;x.strokeRect(20,20,1160,635);
 x.strokeStyle='#8a6d1f';x.lineWidth=3;x.strokeRect(36,36,1128,603);
 if(ICON.complete) x.drawImage(ICON,500,60,200,200);
 const nm=(document.getElementById('nm').value||'Херој').toUpperCase();
 x.textAlign='center';x.fillStyle='#FFD700';
 x.font='bold 56px Georgia';x.fillText(TITLE_MK,600,330);
 x.font='30px Georgia';x.fillStyle='#fff';x.fillText(TITLE_EN,600,372);
 x.font='bold 44px Georgia';x.fillStyle='#FFD700';x.fillText(nm,600,440);
 x.font='28px Georgia';x.fillStyle='#fff';x.fillText(PROGRESS,600,492);
 x.font='24px Georgia';x.fillStyle='#D4AF37';
 x.fillText('✦ Светлината на знаењето · The Light of Knowledge ✦',600,545);
 x.font='italic 22px Georgia';x.fillText('Personal educational keepsake / '+new Date().toLocaleDateString('mk-MK'),600,600);
}
function dl(){const a=document.createElement('a');a.download='wpa-certificate.png';a.href=document.getElementById('c').toDataURL('image/png');a.click();}
ICON.onload=draw; draw();
</script></body></html>
